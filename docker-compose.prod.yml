version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart_campus_mysql
    restart: always
    environment:
      MYSQL_DATABASE: campus_lost_found
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CampusMySQLPass2026!}
      MYSQL_USER: ${DB_USER:-campus_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-CampusAppSecret2026!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      # Expose only to localhost in production; never expose 0.0.0.0
      - "127.0.0.1:3306:3306"
    networks:
      - campus_internal_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_campus_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: campus_lost_found
      DB_USER: ${DB_USER:-campus_app}
      DB_PASSWORD: ${DB_PASSWORD:-CampusAppSecret2026!}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_secure_production_secret_32chars}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    volumes:
      - backend_uploads:/app/app/uploads
    networks:
      - campus_internal_network
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_USE_MOCK: "false"
    container_name: smart_campus_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - campus_internal_network

volumes:
  mysql_data:
  backend_uploads:

networks:
  campus_internal_network:
    driver: bridge
