name: Smart Campus Lost & Found CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.12 & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Backend Unit & Integration Tests
        env:
          TESTING: "true"
          ENVIRONMENT: "testing"
          JWT_SECRET_KEY: "ci-secret-key-for-automated-tests-32chars!"
          DB_HOST: "localhost"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "ci_password"
          DB_NAME: "campus_lost_found_ci"
        run: |
          cd backend
          python -m pytest -v

  frontend-build:
    name: Frontend Build & Verification (Node 20 & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: "https://api.campuslostfound.nie.ac.in"
        run: npm run build
